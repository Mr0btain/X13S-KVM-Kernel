name: Build EL2 kernel + boot tools

# Push a tag like v7.3.1-el2-1 to build and publish a release.
# Run manually (Actions -> Build EL2 kernel -> Run workflow) to build only;
# the files are then attached to the run as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Free native arm64 runner (public repos); build runs in ubuntu:26.04,
    # the distro the kernel config and packages target.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kccache-${{ hashFiles('sources.env', 'config/**', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            kccache-${{ hashFiles('sources.env', 'config/**', 'patches/**') }}-
            kccache-

      - name: Build in ubuntu:26.04
        run: |
          df -h /
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e CI=1 -e JOBS=4 -e CCACHE_DIR=/w/.ccache -e CCACHE_MAXSIZE=4G \
            -e KBUILD_BUILD_USER=github -e KBUILD_BUILD_HOST=actions \
            ubuntu:26.04 scripts/ci-build.sh
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-work-arm64
          path: out/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: out/kernel-build.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-work-arm64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          kver=$(ls dist/linux-image-*.deb | sed -E 's#.*/linux-image-([^_]+)_.*#\1#')
          cat > notes.md <<EOF
          Kernel **${kver}** for the Lenovo ThinkPad X13s booted at **EL2** (KVM) via slbounce,
          with the DSPs (battery, charging, USB-C, audio, sensors) started by qebspil and attached
          by Linux, plus the boot tools. Built from pinned sources (\`sources.env\`) and \`patches/linux\`.

          | File | What |
          |---|---|
          | \`linux-image-${kver}_*.deb\`, \`linux-headers-...\` | the patched kernel (Ubuntu config) |
          | \`qebspilaa64.efi\` / \`-always.efi\` | UEFI driver that starts the DSPs |
          | \`slbounce.efi\`, \`sltest.efi\` | EL2 switch (needs your own \`tcblaunch.exe\`) |

          ### Install (from the normal boot, Secure Boot off)
          \`\`\`sh
          git clone https://github.com/${GITHUB_REPOSITORY}.git && cd $(basename "$GITHUB_REPOSITORY")
          scripts/download-release.sh ${TAG}
          # put tcblaunch.exe at out/el2/tcblaunch.exe (notes/slbounce-el2.md), then:
          sudo scripts/el2-install.sh && sudo scripts/install-esp.sh && sudo scripts/install-kernel.sh
          \`\`\`
          Then pick "Ubuntu (EL2 KVM)" from the F12 boot menu. The normal boot entry is not changed.

          ### SHA-256
          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "EL2 kernel ${kver} + boot tools ($TAG)" --notes-file notes.md
